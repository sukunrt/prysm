# network_params.yaml on geth master: the newer-geth shakeout. Run-scoped;
# the baseline file keeps its pin.
#
#   IMAGE_TAG=geth-master ./kurtosis/build-images.sh
#   kurtosis run --enclave geth-master ~/dev/ethereum-package \
#       --args-file kurtosis/network_params.geth-master.yaml
#
# 5 nodes x 50 keys = 250 validators, 12s slots: the chain config and client
# flags of the Shadow goldfish sims on a plain meshed devnet. Node count and
# keys per node are free; see kurtosis/README.md, Parameters.
#
# Only defaults that matter are spelled out; everything else comes from the
# package's own network_params.yaml.

participants:
  - el_type: geth
    # geth master, pinned build fd07354 (2026-08-26). Works only with the
    # 6.2.1-based prysm-genesis-gen, which predeploys the EIP-8282 builder
    # deposit/exit contracts geth master reads.
    el_image: ethpandaops/geth:master-fd07354
    cl_type: prysm
    # Built by kurtosis/build-images.sh from this tree. Also tagged with the
    # jj change id; :geth-master is what a run uses so the file does not churn.
    cl_image: prysm-beacon-chain:geth-master
    vc_type: prysm
    vc_image: prysm-validator:geth-master
    # The package defaults a 1:1 Prysm BN/VC pair to gRPC
    # (--beacon-rpc-provider) since ethereum-package 04988b4. The REST client
    # now supports the fork's duties, available attestations included, so both
    # paths work; add --enable-beacon-rest-api below to select REST.
    vc_extra_params:
      # Cast the FFG attestation at slot start (plus <=200 ms jitter) instead
      # of on block arrival, so publish time does not depend on block
      # propagation. VC-only flag. --decoupled-ffg-vote-jitter adjusts the
      # jitter; the 200 ms default is recommended.
      - --decoupled-ffg-vote-at-slot-start
    use_separate_vc: true
    # Fulu is at epoch 0, and the package refuses to start a PeerDAS network
    # unless a node is a supernode, a node holds 128+ validators, or
    # perfect_peerdas_enabled is on with 16 participants
    # (src/package_io/input_parser.star:474). Full custody on every node is
    # the honest choice here: these runs measure attestation traffic, and
    # sampling-driven column fetches would only add noise.
    supernode: true
    # 3 of 5 keep a meshed EL; the other two are the isolated-EL arm below.
    count: 3
    cl_extra_params: &cl_flags
      # One log line per availability head vote and per drop, which is what
      # the seat reconciliation reads.
      - --goldfish-vote-ledger
      # Default is 6, and a 5-node enclave offers each node only 4 peers, so
      # the subnet-peer search would never settle. See README, Parameters.
      - --minimum-peers-per-subnet=4
      # Parity with the Shadow runs. At 5 nodes it never binds.
      - --p2p-max-peers=99
    cl_extra_env_vars: &cl_env
      GOMEMLIMIT: 1700MiB

  # round(0.3 x 5) = 2 nodes whose EL takes no peers: their transactions
  # reach a block only through their own proposer. Same CL config as above.
  - el_type: geth
    el_image: ethpandaops/geth:master-fd07354
    el_extra_params:
      - --maxpeers=0
    cl_type: prysm
    cl_image: prysm-beacon-chain:geth-master
    vc_type: prysm
    vc_image: prysm-validator:geth-master
    vc_extra_params:
      - --decoupled-ffg-vote-at-slot-start
    use_separate_vc: true
    supernode: true
    count: 2
    cl_extra_params: *cl_flags
    cl_extra_env_vars: *cl_env

network_params:
  network: kurtosis
  network_id: "3151908"
  preset: mainnet
  seconds_per_slot: 12
  slot_duration_ms: 12000
  # 5 x 50 = 250 validators: 250 / SLOTS_PER_ROUND = 31 attesters per slot.
  num_validator_keys_per_node: 50
  # As the Shadow genesis carries it.
  genesis_gaslimit: 9000000
  # genesis_gaslimit only seeds block 0; the package's default 200M target
  # then lets the limit climb 1/1024 per block. This holds it at 9M.
  gas_limit: 9000000
  # Enough for five nodes' images, keys and genesis before slot 0.
  genesis_delay: 180

  # Genesis is Heze. Nothing upgrades into Heze at runtime -- prysmctl builds
  # the Heze state directly (see Dockerfile.genesis-gen) -- so every fork is
  # at epoch 0. Gloas must be 0 too: prysm gates on GloasForkEpoch in ~86
  # non-test sites, and Gloas at 0 is what puts amsterdamTime on the EL
  # genesis, which forkchoiceUpdatedV4 requires.
  deneb_fork_epoch: 0
  electra_fork_epoch: 0
  fulu_fork_epoch: 0
  gloas_fork_epoch: 0
  heze_fork_epoch: 0

  # An explicit single-entry BLOB_SCHEDULE. The generator builds the CL
  # BLOB_SCHEDULE out of the BPO_* vars, so exactly one non-default BPO gives
  # exactly one entry; bpo_2..5 stay at FAR_FUTURE.
  bpo_1_epoch: 0
  # Mainnet's current BPO2 values; the Shadow harness runs the same schedule.
  bpo_1_max_blobs: 21
  bpo_1_target_blobs: 14
  bpo_2_epoch: 18446744073709551615

ethereum_genesis_generator_params:
  # Patched generator: Heze stripped from the CL->EL fork mapping (Heze is
  # CL-only), the fork's own keys added to the CL config template, and the CL
  # genesis state built by prysmctl instead of eth-genesis-state-generator.
  # The patches are commits on sukunrt/ethereum-genesis-generator, branch
  # `decoupled`; this image is that branch plus this tree's prysmctl.
  image: prysm-genesis-gen:geth-master
  extra_env:
    # Four rounds to the 32-slot epoch: the attestation-traffic multiplier
    # the measurements are about.
    SLOTS_PER_ROUND: 8
    # How far into the slot an availability attestation is due, in basis
    # points of the slot.
    AVAILABLE_ATTESTATION_DUE_BPS_HEZE: 2500
    # ~3000-validator committees at every scale. Small runs like this one
    # floor to one committee per slot holding the whole per-slot pool.
    TARGET_COMMITTEE_SIZE: 3000
    # Always committees per slot: validators / SLOTS_PER_ROUND /
    # TARGET_COMMITTEE_SIZE, min 1. Derived from 250 validators here;
    # recompute when scaling.
    ATTESTATION_SUBNET_COUNT: 1
    # As the Shadow sims run it. With one subnet both draws land on subnet 0.
    SUBNETS_PER_NODE: 2
    # The package's constant is 0x90000038; the sims run 0x90000000, and the
    # fork digest is the only thing that reads it. ExtraEnvVars are rendered
    # after the fork versions in values.env.tmpl, so this wins.
    HEZE_FORK_VERSION: "0x90000000"
    # No SLOT_DURATION_IN_SECONDS here: the generator's default is 12 and so
    # is this run's slot. Set it whenever seconds_per_slot is not 12 -- the
    # package exports SLOT_DURATION_MS only, and the CL template reads
    # SECONDS_PER_SLOT from that variable.

# The Shadow traffic recipe, via spamoor. Funding works since spamoor v1.2.0:
# with --without-batcher each child wallet gets its own 204,600-gas funding tx
# (Amsterdam first-touch price), so nothing approaches the block gas limit.
# See plan-spamoor-kurtosis.md. eoatx is pinned to a meshed EL: unpinned it
# round-robins every EL, wedges wallets on the isolated ones, and stalls at
# max_pending.
spamoor_params:
  image: ethpandaops/spamoor:v1.2.3
  extra_args:
    - --without-batcher
  start_chainload: false
  spammers:
    - name: eoatx
      scenario: eoatx
      config:
        throughput: 8
        max_pending: 16
        max_wallets: 40
        # 16 KiB calldata costs 21000 + 64*16384 = 1069576 gas; ~3% headroom.
        gas_limit: 1100000
        data: random:16384
        client_group: 1-geth-prysm
    - name: blobs-public
      scenario: blobs
      config:
        throughput: 2
        sidecars: 3
        max_pending: 6
        max_wallets: 10
        client_group: 1-geth-prysm
    - name: blobs-private
      scenario: blobs
      config:
        throughput: 2
        sidecars: 3
        max_pending: 6
        max_wallets: 10
        client_group: 4-geth-prysm

additional_services:
  - spamoor

wait_for_finalization: false
global_log_level: info
