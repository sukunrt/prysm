# ethpandaops/ethereum-package args for the decoupled fork.
#
#   kurtosis run --enclave rounds-10-verify ~/dev/ethereum-package \
#       --args-file kurtosis/runs/10-verify/network_params.yaml
#
# Run 10: the auditable run. Every node writes the per-vote ledger, so the
# seat fraction is not taken on trust: kurtosis/votetally.py reconciles every
# seat the committee schedule expects, per node per slot, against what the
# node's ledger says became of it - accepted, dropped with a reason, or never
# delivered at all.
#
# The bar is every window sample at exactly 1.00 with zero unaccounted seats.
# Run 08 reached 775 of 780 with the subscription buffer fix; the five short
# samples were single-node single-slot batches with no counter naming them,
# which is what the ledger and goldfish_vote_drop_total{reason} exist for.
# Same topology, same EL pin, same tooling as runs 06 to 09.
#
# 6 beacon nodes x 22 keys = 132 validators, no late publishers, no blob
# traffic. The validator total does not shrink with the node count: prysmctl's
# genesis builder never returns when there are too few validators to fill the
# PTC window (see kurtosis/README.md), so the total stays near 128.

participants:
  - el_type: geth
    # Pinned, not :latest -- same reasoning as run 05: geth master rejects
    # every forkchoiceUpdatedV4 without the ePBS builder-deposit system
    # contract, which ethereum-genesis-generator 6.0.2 does not deploy.
    el_image: ethpandaops/geth:glamsterdam-devnet-8
    cl_type: prysm
    # Built by kurtosis/build-images.sh from this tree. Also tagged with the
    # jj change id; :local is what a run uses so the file does not churn.
    cl_image: prysm-beacon-chain:local
    vc_type: prysm
    vc_image: prysm-validator:local
    use_separate_vc: true
    # Fulu is at epoch 0, and the package refuses to start a PeerDAS network
    # unless a node is a supernode. Full custody on every node, as in run 05.
    supernode: true
    count: 6
    # One line per head vote per node, which is what votetally.py reconciles
    # the committee schedule against. Off by default; the topic carries one
    # message per seat holder per slot.
    cl_extra_params:
      - --goldfish-vote-ledger

network_params:
  network: kurtosis
  network_id: "3151908"
  preset: mainnet
  seconds_per_slot: 6
  slot_duration_ms: 6000
  # 6 x 22 = 132 validators; see the note above on the 128 floor.
  num_validator_keys_per_node: 22
  # Enough for six nodes' images, keys and genesis before slot 0.
  genesis_delay: 180

  # Genesis is Heze. Nothing upgrades into Heze at runtime -- prysmctl builds
  # the Heze state directly -- so every fork is at epoch 0.
  deneb_fork_epoch: 0
  electra_fork_epoch: 0
  fulu_fork_epoch: 0
  gloas_fork_epoch: 0
  heze_fork_epoch: 0

  # An explicit single-entry BLOB_SCHEDULE, as in run 05.
  bpo_1_epoch: 0
  bpo_1_max_blobs: 6
  bpo_1_target_blobs: 3
  bpo_2_epoch: 18446744073709551615

ethereum_genesis_generator_params:
  # Patched generator: Heze stripped from the CL->EL fork mapping (Heze is
  # CL-only), SLOTS_PER_ROUND added to the CL config template, and the CL
  # genesis state built by prysmctl.
  image: prysm-genesis-gen:local
  extra_env:
    # Four rounds to the 32-slot epoch. This is the whole point of the run:
    # with round-based FFG, justification and finalization move on this
    # cadence, so finality should lag the clock by a couple of rounds rather
    # than a couple of epochs.
    SLOTS_PER_ROUND: 8
    AVAILABLE_ATTESTATION_DUE_BPS_HEZE: 2500

additional_services: []
wait_for_finalization: false
global_log_level: info
