# ethpandaops/ethereum-package args for the decoupled fork.
#
#   kurtosis run --enclave decoupled ~/dev/ethereum-package \
#       --args-file kurtosis/network_params.yaml
#
# This file is the 2-node shakeout. For the measurement runs bump
# participants[0].count to 10-16 and keep the total validator count at ~128
# (num_validator_keys_per_node = 128 / count).
#
# Only defaults that matter are spelled out; everything else comes from the
# package's own network_params.yaml.

participants:
  - el_type: geth
    # Pinned, not :latest. This is commit 366048ea (2026-08-10), byte for
    # byte the geth the ethshadow baseline ran, which is the point of having
    # two harnesses. It also has to be pinned: geth master from 2026-08-19
    # rejects every forkchoiceUpdatedV4 with "failed to process builder
    # deposit queue: empty system contract: no code at
    # 0x0000bFF46984e3725691FA540a8C7589300D8282" -- newer geth wants the
    # ePBS builder-deposit system contract in the EL genesis, and
    # ethereum-genesis-generator 6.0.2 does not deploy it (it knows only
    # 4788, 2935, 7002, 7251 and the deposit contract). Moving to a newer
    # geth means teaching the generator that contract first.
    el_image: ethpandaops/geth:glamsterdam-devnet-8
    cl_type: prysm
    # Built by kurtosis/build-images.sh from this tree. Also tagged with the
    # jj change id; :local is what a run uses so the file does not churn.
    cl_image: prysm-beacon-chain:local
    vc_type: prysm
    vc_image: prysm-validator:local
    # The Prysm VC must talk gRPC: its REST client has no Gloas/Heze SSZ
    # block codec. The package passes --beacon-rest-api-provider
    # unconditionally and Prysm enables the REST client on the flag's mere
    # presence, which no vc_extra_params value can undo -- the image's
    # entrypoint shim drops the flag instead. See validator-entrypoint.sh.
    vc_extra_params: []
    use_separate_vc: true
    # Fulu is at epoch 0, and the package refuses to start a PeerDAS network
    # unless a node is a supernode, a node holds 128+ validators, or
    # perfect_peerdas_enabled is on with 16 participants
    # (src/package_io/input_parser.star:474). Full custody on every node is
    # the honest choice here: these runs measure attestation traffic, and
    # sampling-driven column fetches would only add noise.
    supernode: true
    count: 2

network_params:
  network: kurtosis
  network_id: "3151908"
  preset: mainnet
  seconds_per_slot: 12
  slot_duration_ms: 12000
  # 2 x 64 = 128 validators, as in the ethshadow baseline: 128 /
  # SLOTS_PER_ROUND = 16 attesters per slot.
  num_validator_keys_per_node: 64
  # Enough for the images to come up before slot 0.
  genesis_delay: 60

  # Genesis is Heze. Nothing upgrades into Heze at runtime -- prysmctl builds
  # the Heze state directly (see Dockerfile.genesis-gen) -- so every fork is
  # at epoch 0. Gloas must be 0 too: prysm gates on GloasForkEpoch in ~86
  # non-test sites, and Gloas at 0 is what puts amsterdamTime on the EL
  # genesis, which forkchoiceUpdatedV4 requires.
  deneb_fork_epoch: 0
  electra_fork_epoch: 0
  fulu_fork_epoch: 0
  gloas_fork_epoch: 0
  heze_fork_epoch: 0

  # An explicit single-entry BLOB_SCHEDULE. The generator builds the CL
  # BLOB_SCHEDULE out of the BPO_* vars, so exactly one non-default BPO gives
  # exactly one entry; bpo_2..5 stay at FAR_FUTURE.
  bpo_1_epoch: 0
  bpo_1_max_blobs: 6
  bpo_1_target_blobs: 3
  bpo_2_epoch: 18446744073709551615

ethereum_genesis_generator_params:
  # Patched generator: Heze stripped from the CL->EL fork mapping (Heze is
  # CL-only), SLOTS_PER_ROUND added to the CL config template, and the CL
  # genesis state built by prysmctl instead of eth-genesis-state-generator.
  image: prysm-genesis-gen:local
  extra_env:
    # Four rounds to the 32-slot epoch: the attestation-traffic multiplier
    # the measurements are about.
    SLOTS_PER_ROUND: 8

additional_services: []
wait_for_finalization: false
global_log_level: info
