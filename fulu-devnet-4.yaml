CONFIG_NAME: fulu-devnet-4
PRESET_BASE: 'mainnet'

# Genesis
# ---------------------------------------------------------------
# Only 4 validators. SlotCommitteeCount(4) = 4/32/128 = 0, which the
# helper clamps to 1, so there is exactly one committee per slot, and
# only 4 of the 32 slots in an epoch carry an attestation.
MIN_GENESIS_ACTIVE_VALIDATOR_COUNT: 4
GENESIS_FORK_VERSION: 0x10000000

# Forking
# ---------------------------------------------------------------
# Everything through Fulu activates at genesis. Entries tie at epoch 0
# and break by version enum, so Fulu wins and the chain starts there.
ALTAIR_FORK_VERSION: 0x11000000
ALTAIR_FORK_EPOCH: 0
BELLATRIX_FORK_VERSION: 0x12000000
BELLATRIX_FORK_EPOCH: 0
CAPELLA_FORK_VERSION: 0x13000000
CAPELLA_FORK_EPOCH: 0
DENEB_FORK_VERSION: 0x14000000
DENEB_FORK_EPOCH: 0
ELECTRA_FORK_VERSION: 0x15000000
ELECTRA_FORK_EPOCH: 0
FULU_FORK_VERSION: 0x16000000
FULU_FORK_EPOCH: 0

# Gloas and Hegota get fork versions but no epochs, so they inherit
# FAR_FUTURE_EPOCH and stay unscheduled. Setting either to 0 does not
# work: prysmctl cannot build a genesis state above Fulu, and the
# upgrade path only fires when the chain crosses the boundary.
GLOAS_FORK_VERSION: 0x17000000
HEGOTA_FORK_VERSION: 0x18000000

# Deposit contract
# ---------------------------------------------------------------
# 1337 must match interop.GethTestnetGenesis's hardcoded
# defaultTestChainId, which is what lands in the generated genesis.json.
DEPOSIT_CHAIN_ID: 1337
DEPOSIT_NETWORK_ID: 1337
DEPOSIT_CONTRACT_ADDRESS: 0x4242424242424242424242424242424242424242

# Drop the BPO entries inherited from the mainnet preset, which would
# otherwise flip the fork digest at mainnet epoch 412672.
BLOB_SCHEDULE: []
